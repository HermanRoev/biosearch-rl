name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[all]"

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          PYGAME_HIDE_SUPPORT_PROMPT: "1"
        run: pytest

      - name: Run headless smoke test
        run: biosearch-demo --controller moth --headless --steps 20 --seed 7
