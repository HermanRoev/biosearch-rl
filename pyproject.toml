[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "biosearch-rl"
version = "0.3.0"
description = "A reproducible 2D odor-source search simulation for robotics and reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Herman Rov" }]
keywords = [
    "reinforcement-learning",
    "robotics",
    "odor-source-localization",
    "bio-inspired-robotics",
    "inverse-reinforcement-learning",
    "imitation-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.4,<3",
]
analysis = [
    "imageio>=2.34,<3",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<4",
    "pillow>=10,<13",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
all = [
    "stable-baselines3>=2.4,<3",
    "imageio>=2.34,<3",
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<4",
    "pillow>=10,<13",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
biosearch-demo = "biosearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
